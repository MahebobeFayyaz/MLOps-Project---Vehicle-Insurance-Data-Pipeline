<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Insurance Prediction</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<div class="main-container">


    <div class="card">


        <div class="header">

            <h1>🚗 Vehicle Insurance Prediction</h1>

            <p>
                AI-powered vehicle insurance response prediction system
            </p>

        </div>



        <form method="post" action="/">


            <div class="form-grid">


                <div class="input-group">

                    <label>
                        Gender
                    </label>

                    <input 
                        type="number"
                        name="Gender"
                        min="0"
                        max="1"
                        placeholder="0 = Female, 1 = Male"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Age
                    </label>

                    <input 
                        type="number"
                        name="Age"
                        placeholder="Enter age"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Driving License
                    </label>

                    <input 
                        type="number"
                        name="Driving_License"
                        min="0"
                        max="1"
                        placeholder="0 = No, 1 = Yes"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Region Code
                    </label>

                    <input 
                        type="number"
                        step="0.01"
                        name="Region_Code"
                        placeholder="Region code"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Previously Insured
                    </label>

                    <input 
                        type="number"
                        name="Previously_Insured"
                        min="0"
                        max="1"
                        placeholder="0 = No, 1 = Yes"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Annual Premium
                    </label>

                    <input 
                        type="number"
                        step="0.01"
                        name="Annual_Premium"
                        placeholder="Premium amount"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Policy Sales Channel
                    </label>

                    <input 
                        type="number"
                        step="0.01"
                        name="Policy_Sales_Channel"
                        placeholder="Channel ID"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Vintage
                    </label>

                    <input 
                        type="number"
                        name="Vintage"
                        placeholder="Customer vintage"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Vehicle Age < 1 Year
                    </label>

                    <input 
                        type="number"
                        name="Vehicle_Age_lt_1_Year"
                        min="0"
                        max="1"
                        placeholder="0 or 1"
                        required>

                </div>




                <div class="input-group">

                    <label>
                        Vehicle Age > 2 Years
                    </label>

                    <input 
                        type="number"
                        name="Vehicle_Age_gt_2_Years"
                        min="0"
                        max="1"
                        placeholder="0 or 1"
                        required>

                </div>




                <div class="input-group full-width">

                    <label>
                        Vehicle Damage
                    </label>

                    <input 
                        type="number"
                        name="Vehicle_Damage_Yes"
                        min="0"
                        max="1"
                        placeholder="0 = No Damage, 1 = Damage"
                        required>

                </div>


            </div>




            <button type="submit">
                🔍 Predict Insurance Response
            </button>


        </form>




        {% if context %}

        <div class="result">

            <h2>
                Prediction Result
            </h2>

            <p>
                {{ context }}
            </p>

        </div>

        {% endif %}




    </div>


</div>


</body>

</html>
